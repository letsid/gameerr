openapi: 3.0.2
info:
  title: Gameerr API
  version: 1.0.0
  description: |
    This is the documentation for the Gameerr API backend.

    Two primary authentication methods are supported:

    - **Cookie Authentication**: A valid sign-in to the `/auth/plex` or `/auth/local` will generate a valid authentication cookie.
    - **API Key Authentication**: Sign-in is also possible by passing an `X-Api-Key` header along with a valid API Key generated by Gameerr.
tags:
  - name: public
    description: Public API endpoints requiring no authentication.
  - name: settings
    description: Endpoints related to Gameerr's settings and configuration.
  - name: auth
    description: Endpoints related to logging in or out, and the currently authenticated user.
  - name: users
    description: Endpoints related to user management.
  - name: search
    description: Endpoints related to search and discovery.
  - name: request
    description: Endpoints related to request management.
  - name: other
    description: Miscellaneous endpoints
  - name: media
    description: Endpoints related to media management.
  - name: watchlist
    description: Collection of media to watch later
  - name: blocklist
    description: Blocklisted media from discovery page.
servers:
  - url: '{server}/api/v1'
    variables:
      server:
        default: http://localhost:5055
components:
  schemas:
    WatchlistRequest:
      type: object
      required:
        - igdbId
      properties:
        igdbId:
          type: number
          example: 1942
        title:
          type: string
          example: 'The Witcher 3: Wild Hunt'
    Watchlist:
      type: object
      properties:
        id:
          type: integer
          example: 1
          readOnly: true
        igdbId:
          type: number
          example: 1942
        mediaType:
          type: string
          enum:
            - game
        title:
          type: string
        media:
          $ref: '#/components/schemas/MediaInfo'
        createdAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
        updatedAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
        requestedBy:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
          readOnly: true
        email:
          type: string
          example: hey@itsme.com
          readOnly: true
        username:
          type: string
        plexUsername:
          type: string
          readOnly: true
        plexToken:
          type: string
          readOnly: true
        jellyfinAuthToken:
          type: string
          readOnly: true
        userType:
          type: integer
          example: 1
          readOnly: true
        permissions:
          type: number
          example: 0
        avatar:
          type: string
          readOnly: true
        createdAt:
          type: string
          example: '2020-09-02T05:02:23.000Z'
          readOnly: true
        updatedAt:
          type: string
          example: '2020-09-02T05:02:23.000Z'
          readOnly: true
        requestCount:
          type: number
          example: 5
          readOnly: true
      required:
        - id
        - email
        - createdAt
        - updatedAt
    UserSettings:
      type: object
      properties:
        username:
          type: string
          nullable: true
          example: Mr User
        email:
          type: string
          example: user@example.com
        locale:
          type: string
          nullable: true
          example: en
        preferredPlatforms:
          type: array
          nullable: true
          description: IGDB platform IDs the user is interested in. Null uses the global default.
          items:
            type: number
          example:
            - 6
        gameQuotaLimit:
          type: number
          nullable: true
          description: Maximum number of game requests allowed
          example: 10
        gameQuotaDays:
          type: number
          nullable: true
          description: Time period in days for the game quota
          example: 30
        globalGameQuotaLimit:
          type: number
          nullable: true
          description: Global game quota limit setting
          example: 10
        globalGameQuotaDays:
          type: number
          nullable: true
          description: Global game quota days setting
          example: 30
    MainSettings:
      type: object
      properties:
        apiKey:
          type: string
          readOnly: true
        appLanguage:
          type: string
          example: en
        applicationTitle:
          type: string
          example: Gameerr
        applicationUrl:
          type: string
          example: https://os.example.com
        hideAvailable:
          type: boolean
          example: false
        hideRequested:
          type: boolean
          example: false
        localLogin:
          type: boolean
          example: true
        mediaServerType:
          type: number
          example: 1
        newPlexLogin:
          type: boolean
          example: true
        defaultPermissions:
          type: number
          example: 32
        versionCheck:
          type: boolean
          example: false
    NetworkSettings:
      type: object
      properties:
        csrfProtection:
          type: boolean
          example: false
        forceIpv4First:
          type: boolean
          example: false
        trustProxy:
          type: boolean
          example: false
        proxy:
          type: object
          properties:
            enabled:
              type: boolean
              example: false
            hostname:
              type: string
              example: ''
            port:
              type: number
              example: 8080
            useSsl:
              type: boolean
              example: false
            user:
              type: string
              example: ''
            password:
              type: string
              example: ''
            bypassFilter:
              type: string
              example: ''
            bypassLocalAddresses:
              type: boolean
              example: true
        dnsCache:
          type: object
          properties:
            enabled:
              type: boolean
              example: false
            forceMinTtl:
              type: number
              example: 0
            forceMaxTtl:
              type: number
              example: -1
    PlexSettings:
      type: object
      properties:
        name:
          type: string
          example: Main Server
          readOnly: true
        machineId:
          type: string
          example: '1234123412341234'
          readOnly: true
        ip:
          type: string
          example: 127.0.0.1
        port:
          type: number
          example: 32400
        useSsl:
          type: boolean
          nullable: true
        webAppUrl:
          type: string
          nullable: true
          example: https://app.plex.tv/desktop
      required:
        - name
        - machineId
        - ip
        - port
    PlexConnection:
      type: object
      properties:
        protocol:
          type: string
          example: https
        address:
          type: string
          example: 127.0.0.1
        port:
          type: number
          example: 32400
        uri:
          type: string
          example: https://127-0-0-1.2ab6ce1a093d465e910def96cf4e4799.plex.direct:32400
        local:
          type: boolean
          example: true
        status:
          type: number
          example: 200
        message:
          type: string
          example: OK
      required:
        - protocol
        - address
        - port
        - uri
        - local
    PlexDevice:
      type: object
      properties:
        name:
          type: string
          example: My Plex Server
        product:
          type: string
          example: Plex Media Server
        productVersion:
          type: string
          example: '1.21'
        platform:
          type: string
          example: Linux
        platformVersion:
          type: string
          example: default/linux/amd64/17.1/systemd
        device:
          type: string
          example: PC
        clientIdentifier:
          type: string
          example: 85a943ce-a0cc-4d2a-a4ec-f74f06e40feb
        createdAt:
          type: string
          example: '2021-01-01T00:00:00.000Z'
        lastSeenAt:
          type: string
          example: '2021-01-01T00:00:00.000Z'
        provides:
          type: array
          items:
            type: string
            example: server
        owned:
          type: boolean
          example: true
        ownerID:
          type: string
          example: '12345'
        home:
          type: boolean
          example: true
        sourceTitle:
          type: string
          example: xyzabc
        accessToken:
          type: string
          example: supersecretaccesstoken
        publicAddress:
          type: string
          example: 127.0.0.1
        httpsRequired:
          type: boolean
          example: true
        synced:
          type: boolean
          example: true
        relay:
          type: boolean
          example: true
        dnsRebindingProtection:
          type: boolean
          example: false
        natLoopbackSupported:
          type: boolean
          example: false
        publicAddressMatches:
          type: boolean
          example: false
        presence:
          type: boolean
          example: true
        connection:
          type: array
          items:
            $ref: '#/components/schemas/PlexConnection'
      required:
        - name
        - product
        - productVersion
        - platform
        - device
        - clientIdentifier
        - createdAt
        - lastSeenAt
        - provides
        - owned
        - connection
    JellyfinSettings:
      type: object
      properties:
        name:
          type: string
          example: Main Server
          readOnly: true
        hostname:
          type: string
          example: http://my.jellyfin.host
        externalHostname:
          type: string
          example: http://my.jellyfin.host
        jellyfinForgotPasswordUrl:
          type: string
          example: http://my.jellyfin.host/web/index.html#!/forgotpassword.html
        adminUser:
          type: string
          example: admin
        adminPass:
          type: string
          example: mypassword
        serverID:
          type: string
          readOnly: true
    PublicSettings:
      type: object
      required:
        - initialized
        - plexClientIdentifier
      properties:
        initialized:
          type: boolean
          example: false
        plexClientIdentifier:
          type: string
          format: uuid
          description: Instance Plex OAuth client identifier
          example: 6919275e-142a-48d8-be6b-93594cbd4626
    MediaRequest:
      type: object
      properties:
        id:
          type: number
          example: 123
          readOnly: true
        status:
          type: number
          example: 0
          description: Status of the request. 1 = PENDING APPROVAL, 2 = APPROVED, 3 = DECLINED, 4 = FAILED, 5 = COMPLETED
          readOnly: true
        media:
          $ref: '#/components/schemas/MediaInfo'
        createdAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
        updatedAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
        requestedBy:
          $ref: '#/components/schemas/User'
        modifiedBy:
          anyOf:
            - $ref: '#/components/schemas/User'
            - type: string
              nullable: true
        ignoreQuota:
          type: boolean
          example: false
          description: If true, this request will not count against the user's quota. Requires MANAGE_REQUESTS permission.
        type:
          type: string
          enum:
            - game
        platform:
          type: number
          example: 6
          description: IGDB platform ID the game was requested for
      required:
        - id
        - status
    MediaInfo:
      type: object
      properties:
        id:
          type: number
          readOnly: true
        mediaType:
          type: string
          enum:
            - game
          readOnly: true
        igdbId:
          type: number
          readOnly: true
          example: 1942
        steamAppId:
          type: number
          readOnly: true
          nullable: true
        title:
          type: string
          readOnly: true
          nullable: true
        coverImageId:
          type: string
          readOnly: true
          nullable: true
        platforms:
          type: array
          readOnly: true
          nullable: true
          description: IGDB platform IDs the game has been released on
          items:
            type: number
        status:
          type: number
          example: 0
          description: Availability of the game. 1 = `UNKNOWN`, 2 = `PENDING`, 3 = `PROCESSING`, 4 = `PARTIALLY_AVAILABLE`, 5 = `AVAILABLE`, 6 = `BLOCKLISTED`, 7 = `DELETED`
        requests:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/MediaRequest'
        createdAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
        updatedAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
    PageInfo:
      type: object
      properties:
        page:
          type: number
          example: 1
        pages:
          type: number
          example: 10
        results:
          type: number
          example: 100
    DiscordSettings:
      type: object
      properties:
        enabled:
          type: boolean
          example: false
        types:
          type: number
          example: 2
        options:
          type: object
          properties:
            botUsername:
              type: string
            botAvatarUrl:
              type: string
            webhookUrl:
              type: string
            webhookRoleId:
              type: string
            enableMentions:
              type: boolean
    SlackSettings:
      type: object
      properties:
        enabled:
          type: boolean
          example: false
        types:
          type: number
          example: 2
        options:
          type: object
          properties:
            webhookUrl:
              type: string
    WebPushSettings:
      type: object
      properties:
        enabled:
          type: boolean
          example: false
        types:
          type: number
          example: 2
    WebhookSettings:
      type: object
      properties:
        enabled:
          type: boolean
          example: false
        types:
          type: number
          example: 2
        options:
          type: object
          properties:
            webhookUrl:
              type: string
            authHeader:
              type: string
            jsonPayload:
              type: string
            supportVariables:
              type: boolean
              example: false
    TelegramSettings:
      type: object
      properties:
        enabled:
          type: boolean
          example: false
        types:
          type: number
          example: 2
        options:
          type: object
          properties:
            botUsername:
              type: string
            botAPI:
              type: string
            chatId:
              type: string
            messageThreadId:
              type: string
            sendSilently:
              type: boolean
    PushbulletSettings:
      type: object
      properties:
        enabled:
          type: boolean
          example: false
        types:
          type: number
          example: 2
        options:
          type: object
          properties:
            accessToken:
              type: string
            channelTag:
              type: string
              nullable: true
    PushoverSettings:
      type: object
      properties:
        enabled:
          type: boolean
          example: false
        types:
          type: number
          example: 2
        options:
          type: object
          properties:
            accessToken:
              type: string
            userToken:
              type: string
            sound:
              type: string
    GotifySettings:
      type: object
      properties:
        enabled:
          type: boolean
          example: false
        types:
          type: number
          example: 2
        options:
          type: object
          properties:
            url:
              type: string
            token:
              type: string
    NtfySettings:
      type: object
      properties:
        enabled:
          type: boolean
          example: false
        types:
          type: number
          example: 2
        options:
          type: object
          properties:
            url:
              type: string
            topic:
              type: string
            tags:
              type: string
            authMethodUsernamePassword:
              type: boolean
            username:
              type: string
            password:
              type: string
            authMethodToken:
              type: boolean
            token:
              type: string
            priority:
              type: number
            locale:
              type: string
    NotificationEmailSettings:
      type: object
      properties:
        enabled:
          type: boolean
          example: false
        types:
          type: number
          example: 2
        options:
          type: object
          properties:
            emailFrom:
              type: string
              example: no-reply@example.com
            senderName:
              type: string
              example: Gameerr
            smtpHost:
              type: string
              example: 127.0.0.1
            smtpPort:
              type: number
              example: 465
            secure:
              type: boolean
              example: false
            ignoreTls:
              type: boolean
              example: false
            requireTls:
              type: boolean
              example: false
            authUser:
              type: string
              nullable: true
            authPass:
              type: string
              nullable: true
            allowSelfSigned:
              type: boolean
              example: false
    Job:
      type: object
      properties:
        id:
          type: string
          example: job-name
        type:
          type: string
          enum:
            - process
            - command
        interval:
          type: string
          enum:
            - short
            - long
            - fixed
        name:
          type: string
          example: A Job Name
        nextExecutionTime:
          type: string
          example: '2020-09-02T05:02:23.000Z'
        running:
          type: boolean
          example: false
    UserSettingsNotifications:
      type: object
      properties:
        notificationTypes:
          $ref: '#/components/schemas/NotificationAgentTypes'
        emailEnabled:
          type: boolean
        pgpKey:
          type: string
          nullable: true
        discordEnabled:
          type: boolean
        discordEnabledTypes:
          type: number
          nullable: true
        discordIds:
          type: array
          items:
            type: string
          nullable: true
        pushbulletAccessToken:
          type: string
          nullable: true
        pushoverApplicationToken:
          type: string
          nullable: true
        pushoverUserKey:
          type: string
          nullable: true
        pushoverSound:
          type: string
          nullable: true
        telegramEnabled:
          type: boolean
        telegramBotUsername:
          type: string
          nullable: true
        telegramChatId:
          type: string
          nullable: true
        telegramMessageThreadId:
          type: string
          nullable: true
        telegramSendSilently:
          type: boolean
          nullable: true
    NotificationAgentTypes:
      type: object
      properties:
        discord:
          type: number
        email:
          type: number
        pushbullet:
          type: number
        pushover:
          type: number
        slack:
          type: number
        telegram:
          type: number
        webhook:
          type: number
        webpush:
          type: number
    DiscoverSlider:
      type: object
      properties:
        id:
          type: number
          example: 1
        type:
          type: number
          example: 1
        title:
          type: string
          nullable: true
        isBuiltIn:
          type: boolean
        enabled:
          type: boolean
        data:
          type: string
          example: '1234'
          nullable: true
      required:
        - type
        - enabled
        - title
        - data
    BlocklistRequest:
      type: object
      required:
        - igdbId
      properties:
        igdbId:
          type: number
          example: 1942
        title:
          type: string
          example: 'The Witcher 3: Wild Hunt'
    GameResult:
      type: object
      description: A game as returned by search and discover endpoints
      properties:
        id:
          type: number
          example: 1942
          description: IGDB game ID
        name:
          type: string
          example: 'The Witcher 3: Wild Hunt'
        coverImageId:
          type: string
          nullable: true
        slug:
          type: string
        summary:
          type: string
        firstReleaseDate:
          type: number
          nullable: true
          description: Unix timestamp of the first release on any platform
        year:
          type: string
          example: '2015'
        platforms:
          type: array
          items:
            type: number
          description: IGDB platform IDs
        totalRating:
          type: number
        totalRatingCount:
          type: number
        aggregatedRating:
          type: number
        aggregatedRatingCount:
          type: number
        hypes:
          type: number
        mediaInfo:
          $ref: '#/components/schemas/MediaInfo'
    Platform:
      type: object
      properties:
        id:
          type: number
          example: 6
          description: IGDB platform ID
        name:
          type: string
          example: PC (Microsoft Windows)
        abbreviation:
          type: string
          example: PC
        slug:
          type: string
        generation:
          type: number
        platformFamily:
          type: number
        platformType:
          type: number
    MetadataSettings:
      type: object
      properties:
        defaultPlatforms:
          type: array
          items:
            type: number
          example: [6]
        minRatingCount:
          type: number
          example: 50
        recentReleaseDays:
          type: number
          example: 60
        upcomingReleaseDays:
          type: number
          example: 90
        bestReleaseGapYears:
          type: number
          example: 5
          description: Years a game may take to reach a platform and still enter its best list, 0 turns the rule off
        igdbConfigured:
          type: boolean
          readOnly: true
        rawgConfigured:
          type: boolean
          readOnly: true
        openCriticConfigured:
          type: boolean
          readOnly: true
  securitySchemes:
    cookieAuth:
      type: apiKey
      name: connect.sid
      in: cookie
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
paths:
  /status:
    get:
      summary: Get Gameerr status
      description: Returns the current Gameerr status in a JSON object. updateAvailable and commitsBehind are omitted when checkUpdateAvailable is false.
      security: []
      tags:
        - public
      parameters:
        - in: query
          name: checkUpdateAvailable
          description: If false, updateAvailable and commitsBehind will be omitted from the response. Defaults to the versionCheck setting.
          required: false
          example: false
          schema:
            type: boolean
      responses:
        '200':
          description: Returned status
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: 1.0.0
                  commitTag:
                    type: string
                  updateAvailable:
                    type: boolean
                  commitsBehind:
                    type: number
                  restartRequired:
                    type: boolean
  /status/appdata:
    get:
      summary: Get application data volume status
      description: For Docker installs, returns whether or not the volume mount was configured properly. Always returns true for non-Docker installs.
      security: []
      tags:
        - public
      responses:
        '200':
          description: Application data volume status and path
          content:
            application/json:
              schema:
                type: object
                properties:
                  appData:
                    type: boolean
                    example: true
                  appDataPath:
                    type: string
                    example: /app/config
                  appDataPermissions:
                    type: boolean
                    example: true
  /settings/main:
    get:
      summary: Get main settings
      description: Retrieves all main settings in a JSON object.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainSettings'
    post:
      summary: Update main settings
      description: Updates main settings with the provided values.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MainSettings'
      responses:
        '200':
          description: Values were sucessfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainSettings'
  /settings/network:
    get:
      summary: Get network settings
      description: Retrieves all network settings in a JSON object.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainSettings'
    post:
      summary: Update network settings
      description: Updates network settings with the provided values.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkSettings'
      responses:
        '200':
          description: Values were sucessfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
  /settings/main/regenerate:
    post:
      summary: Get main settings with newly-generated API key
      description: Returns main settings in a JSON object, using the new API key.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainSettings'
  /settings/jellyfin:
    get:
      summary: Get Jellyfin settings
      description: Retrieves current Jellyfin settings.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JellyfinSettings'
    post:
      summary: Update Jellyfin settings
      description: Updates Jellyfin settings with the provided values.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JellyfinSettings'
      responses:
        '200':
          description: Values were successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JellyfinSettings'
  /settings/jellyfin/users:
    get:
      summary: Get Jellyfin Users
      description: Returns a list of Jellyfin Users in a JSON array.
      tags:
        - settings
