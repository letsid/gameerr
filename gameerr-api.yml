        '404':
          description: User does not exist
  /user/{userId}/settings/linked-accounts/jellyfin:
    post:
      summary: Link the provided Jellyfin account to the current user
      description: Logs in to Jellyfin with the provided credentials, then links the associated Jellyfin account with the user's account. Users can only link external accounts to their own account.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: Mr User
                password:
                  type: string
                  example: supersecret
      responses:
        '204':
          description: Linking account succeeded
        '403':
          description: Invalid credentials
        '422':
          description: Account already linked to a user
    delete:
      summary: Remove the linked Jellyfin account for a user
      description: Removes the linked Jellyfin account for a specific user. Requires `MANAGE_USERS` permission if editing other users.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      responses:
        '204':
          description: Unlinking account succeeded
        '400':
          description: Unlink request invalid
        '404':
          description: User does not exist
  /user/{userId}/settings/linked-accounts/jellyfin/quickconnect:
    post:
      summary: Link Jellyfin/Emby account with Quick Connect
      description: Links a Jellyfin/Emby account to the user's profile using Quick Connect authentication
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secret:
                  type: string
              required:
                - secret
      responses:
        '204':
          description: Account successfully linked
        '400':
          description: Invalid Quick Connect secret
        '401':
          description: Unauthorized
        '422':
          description: Account already linked
        '500':
          description: Server error
  /user/{userId}/settings/notifications:
    get:
      summary: Get notification settings for a user
      description: Returns notification settings for a specific user. Requires `MANAGE_USERS` permission if viewing other users.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: User notification settings returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsNotifications'
    post:
      summary: Update notification settings for a user
      description: Updates and returns notification settings for a specific user. Requires `MANAGE_USERS` permission if editing other users.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsNotifications'
      responses:
        '200':
          description: Updated user notification settings returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsNotifications'
  /user/{userId}/settings/permissions:
    get:
      summary: Get permission settings for a user
      description: Returns permission settings for a specific user. Requires `MANAGE_USERS` permission if viewing other users.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: User permission settings returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: number
                    example: 2
    post:
      summary: Update permission settings for a user
      description: Updates and returns permission settings for a specific user. Requires `MANAGE_USERS` permission if editing other users.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: number
              required:
                - permissions
      responses:
        '200':
          description: Updated user general settings returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: number
                    example: 2
  /search:
    get:
      summary: Search for games
      description: Searches IGDB for standalone games. Defaults to the platforms of the signed-in user.
      tags:
        - search
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
            example: Hollow Knight
        - in: query
          name: page
          schema:
            type: number
            example: 1
            default: 1
        - in: query
          name: platforms
          description: Comma separated IGDB platform IDs, or `all` for every platform
          schema:
            type: string
            example: 6,167
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: number
                    example: 1
                  totalPages:
                    type: number
                    example: 20
                  totalResults:
                    type: number
                    example: 200
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/GameResult'
  /platforms:
    get:
      summary: Get all platforms
      description: Returns every IGDB platform, sorted by name.
      tags:
        - search
      responses:
        '200':
          description: Platforms
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Platform'
  /game/{gameId}:
    get:
      summary: Get game details
      description: Returns IGDB details of a game together with its local request state.
      tags:
        - search
      parameters:
        - in: path
          name: gameId
          required: true
          schema:
            type: number
            example: 1942
          description: IGDB game ID
      responses:
        '200':
          description: Game details
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Game not found
  /game/{gameId}/scores:
    get:
      summary: Get score badges of a game
      description: Scores as reported by their sources. Sources without a score are left out.
      tags:
        - search
      parameters:
        - in: path
          name: gameId
          required: true
          schema:
            type: number
            example: 1942
      responses:
        '200':
          description: Score badges
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                          enum: [metacritic, opencritic, igdb, steam]
                        score:
                          type: number
                        scale:
                          type: number
                        count:
                          type: number
                        url:
                          type: string
                        platform:
                          type: number
                        via:
                          type: string
                        match:
                          type: string
  /discover/watchlist:
    get:
      summary: Get the Plex watchlist.
      tags:
        - search
      parameters:
        - in: query
          name: page
          schema:
            type: number
            example: 1
            default: 1
      responses:
        '200':
          description: Watchlist data returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: number
                  totalPages:
                    type: number
                  totalResults:
                    type: number
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        title:
                          type: string
                        igdbId:
                          type: number
                          example: 14593
  /discover/{list}:
    get:
      summary: Get a precomputed discover list
      description: |
        `recent` holds releases of the last days, `upcoming` the next releases, both ranked by IGDB hypes. `best` ranks by IGDB total rating among games with more ratings than the configured minimum. Lists are rebuilt nightly.
      tags:
        - search
      parameters:
        - in: path
          name: list
          required: true
          schema:
            type: string
            enum: [recent, upcoming, best]
        - in: query
          name: platform
          description: IGDB platform ID, defaults to the first platform of the signed-in user
          schema:
            type: number
            example: 6
        - in: query
          name: page
          schema:
            type: number
            example: 1
            default: 1
      responses:
        '200':
          description: Discover list
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: string
                  platform:
                    type: number
                  generatedAt:
                    type: string
                  page:
                    type: number
                  totalPages:
                    type: number
                  totalResults:
                    type: number
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/GameResult'
        '503':
          description: IGDB is not configured
  /charts:
    get:
      summary: List the chart categories
      tags:
        - search
      responses:
        '200':
          description: Chart category ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: string
                      enum: [rpg, action-rpg, roguelike, shooter, strategy, adventure, indie, platform, puzzle, simulator, hack-and-slash, arcade, racing, sport, fighting, turn-based-strategy, real-time-strategy, tactical, point-and-click, visual-novel, card-and-board-game, music]
  /charts/{chart}:
    get:
      summary: Get the all-time chart of a genre
      description: |
        The best rated games of all time in a category, ranked by IGDB total rating among games with enough ratings. The vote minimum starts at 200 and drops for small categories until the chart holds 40 games, the response reports the one used. `roguelike` and `action-rpg` are built from IGDB keywords, they are no IGDB genres. Charts are rebuilt nightly, platform charts on first request.
      tags:
        - search
      parameters:
        - in: path
          name: chart
          required: true
          schema:
            type: string
            enum: [rpg, action-rpg, roguelike, shooter, strategy, adventure, indie, platform, puzzle, simulator, hack-and-slash, arcade, racing, sport, fighting, turn-based-strategy, real-time-strategy, tactical, point-and-click, visual-novel, card-and-board-game, music]
        - in: query
          name: platform
          description: IGDB platform ID, 0 or none for all platforms
          schema:
            type: number
            example: 6
            default: 0
        - in: query
          name: page
          schema:
            type: number
            example: 1
            default: 1
      responses:
        '200':
          description: Chart
          content:
            application/json:
              schema:
                type: object
                properties:
                  chart:
                    type: string
                  platform:
                    type: number
                  generatedAt:
                    type: string
                  minRatingCount:
                    type: number
                  page:
                    type: number
                  totalPages:
                    type: number
                  totalResults:
                    type: number
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/GameResult'
        '404':
          description: Unknown chart
        '503':
          description: IGDB is not configured
  /request:
    get:
      summary: Get all requests
      description: |
        Returns all requests if the user has the `ADMIN` or `MANAGE_REQUESTS` permissions. Otherwise, only the logged-in user's requests are returned.

        If the `requestedBy` parameter is specified, only requests from that particular user ID will be returned.
      tags:
        - request
      parameters:
        - in: query
          name: take
          schema:
            type: number
            nullable: true
            example: 20
        - in: query
          name: skip
          schema:
            type: number
            nullable: true
            example: 0
        - in: query
          name: filter
          schema:
            type: string
            nullable: true
            enum:
              - all
              - approved
              - available
              - pending
              - processing
              - unavailable
              - failed
              - deleted
              - completed
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - added
              - modified
            default: added
        - in: query
          name: sortDirection
          schema:
            type: string
            enum:
              - asc
              - desc
            nullable: true
            default: desc
        - in: query
          name: requestedBy
          schema:
            type: number
            nullable: true
            example: 1
      responses:
        '200':
          description: Requests returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaRequest'
    post:
      summary: Create new request
      description: |
        Creates a new request with the provided media ID and type. The `REQUEST` permission is required.

        If the user has the `ADMIN` or `AUTO_APPROVE` permissions, their request will be auomatically approved.
      tags:
        - request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                igdbId:
                  type: number
                  example: 1942
                platform:
                  type: number
                  example: 6
                  description: IGDB platform ID the game is requested for (6 = PC)
                userId:
                  type: number
                  nullable: true
                ignoreQuota:
                  type: boolean
                  example: false
                  description: If true, this request will not count against the user's quota. Requires MANAGE_REQUESTS permission.
              required:
                - igdbId
                - platform
      responses:
        '201':
          description: Succesfully created the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
  /request/count:
    get:
      summary: Gets request counts
      description: |
        Returns the number of requests by status including pending, approved, available, and completed requests.
      tags:
        - request
      responses:
        '200':
          description: Request counts returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  movie:
                    type: number
                  tv:
                    type: number
                  pending:
                    type: number
                  approved:
                    type: number
                  declined:
                    type: number
                  processing:
                    type: number
                  available:
                    type: number
                  completed:
                    type: number
  /request/{requestId}:
    get:
      summary: Get MediaRequest
      description: Returns a specific MediaRequest in a JSON object.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          example: '1'
          schema:
            type: string
      responses:
        '200':
          description: Succesfully returns request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
    put:
      summary: Update MediaRequest
      description: Updates a specific media request and returns the request in a JSON object. Requires the `MANAGE_REQUESTS` permission.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          example: '1'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                platform:
                  type: number
                  example: 6
                userId:
                  type: number
                  nullable: true
      responses:
        '200':
          description: Succesfully updated request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
        '409':
          description: Only pending requests can be modified
    delete:
      summary: Delete request
      description: Removes a request. If the user has the `MANAGE_REQUESTS` permission, any request can be removed. Otherwise, only pending requests can be removed.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          example: '1'
          schema:
            type: string
      responses:
        '204':
          description: Succesfully removed request
  /request/{requestId}/complete:
    post:
      summary: Mark an approved request as completed
      description: Marks the game as available and completes the request. Requires the `MANAGE_REQUESTS` permission.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            example: '1'
      responses:
        '200':
          description: Completed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
        '409':
          description: The request is not approved
  /request/{requestId}/retry:
    post:
      summary: Retry failed request
      description: Retries a failed request by handing it to the fulfillment provider again.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          schema:
            type: string
            example: '1'
      responses:
        '200':
          description: Retry triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
        '409':
          description: Only failed requests can be retried
  /request/{requestId}/{status}:
    post:
      summary: Update a request's status
      description: |
        Updates a request's status to approved or declined. Also returns the request in a JSON object.

        Requires the `MANAGE_REQUESTS` permission or `ADMIN`.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          schema:
            type: string
            example: '1'
        - in: path
          name: status
          description: New status
          required: true
          schema:
            type: string
            enum:
              - approve
              - decline
      responses:
        '200':
          description: Request status changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
        '400':
          description: Status must be approve or decline
        '409':
          description: Only pending requests can be approved or declined
  /media:
    get:
      summary: Get media
      description: Returns all media (can be filtered and limited) in a JSON object.
      tags:
        - media
      parameters:
        - in: query
          name: take
          schema:
            type: number
            nullable: true
            example: 20
        - in: query
          name: skip
          schema:
            type: number
            nullable: true
            example: 0
        - in: query
          name: filter
          schema:
            type: string
            nullable: true
            enum:
              - all
              - available
              - partial
              - allavailable
              - processing
              - pending
              - deleted
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - added
              - modified
              - mediaAdded
            default: added
      responses:
        '200':
          description: Returned media
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaInfo'
  /media/{mediaId}:
    delete:
      summary: Delete media item
      description: Removes a media item. The `MANAGE_REQUESTS` permission is required to perform this action.
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
      responses:
        '204':
          description: Succesfully removed media item
  /media/{mediaId}/{status}:
    post:
      summary: Update media status
      description: Updates a media item's status and returns the media in JSON format
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
        - in: path
          name: status
          description: New status
          required: true
          example: available
          schema:
            type: string
            enum:
              - available
              - partial
              - processing
              - pending
              - unknown
      responses:
        '200':
          description: Returned media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaInfo'
  /watchlist/{igdbId}:
    delete:
      summary: Delete watchlist item
      description: Removes a watchlist item.
      tags:
        - watchlist
      parameters:
        - in: path
          name: igdbId
          description: IGDB game ID
          required: true
          example: '1942'
          schema:
            type: string
      responses:
        '204':
          description: Succesfully removed watchlist item
  /blocklist/{igdbId}:
    get:
      summary: Get media from blocklist
      tags:
        - blocklist
      parameters:
        - in: path
          name: igdbId
          description: IGDB game ID
          required: true
          example: '1942'
          schema:
            type: string
      responses:
        '200':
          description: Blocklist details in JSON
    delete:
      summary: Remove media from blocklist
      tags:
        - blocklist
      parameters:
        - in: path
          name: igdbId
          description: IGDB game ID
          required: true
          example: '1942'
          schema:
            type: string
      responses:
        '204':
          description: Succesfully removed media item
  /auth/local/setup:
    post:
      summary: Create the initial local admin user
      description: Creates the first user as a local admin account and signs it in. Only possible while no user exists. Afterwards the application only offers local sign-in.
      security: []
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: admin@example.com
                password:
                  type: string
                  minLength: 8
                username:
                  type: string
                  nullable: true
              required:
                - email
                - password
      responses:
        '200':
          description: Admin user created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid email address or password
        '403':
          description: Setup has already been completed
security:
  - cookieAuth: []
  - apiKey: []
